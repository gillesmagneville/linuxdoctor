[package]
name = "linuxdoctor"
version = "0.1.0"
edition = "2021"
description = "Fast, explainable Linux health diagnostics"
license = "GPL-3.0-or-later"
repository = "https://github.com/gillesmagneville/linuxdoctor"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.4.18", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"

[profile.release]
opt-level = 3
lto = true
