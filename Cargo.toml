[package]
name = "linuxdoctor"
version = "1.11.2"
edition = "2021"
rust-version = "1.75"
description = "Fast, explainable Linux health diagnostics"
license = "GPL-3.0-only"
repository = "https://github.com/gillesmagneville/linuxdoctor"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.4.18", features = ["derive"] }
clap_complete = "=4.4.10"
clap_mangen = "=0.2.20"
ratatui = "0.26"
crossterm = "0.27"
toml = { version = "=0.9.6", default-features = false, features = ["std", "serde", "parse"] }

[profile.release]
opt-level = 3
lto = true
